name: Linux Release

# Builds both npm packages from this fork and publishes them as a GitHub release.
# Push a tag such as v0.13.4-linux.1 to run it.

on:
  push:
    tags:
      - "v*-linux.*"
  workflow_dispatch:

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-2022
            platform: win32-x64
          - os: ubuntu-22.04
            platform: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.x"

      - name: Install Node.js via Volta
        uses: volta-cli/action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build native binaries
        run: |
          pnpm --filter @nexusmods/fomod-installer-native build-native
          pnpm --filter @nexusmods/fomod-installer-native build-napi

      - name: Copy native artifacts to prebuilds dir
        working-directory: src/ModInstaller.Native.TypeScript
        shell: bash
        run: |
          mkdir -p prebuilds/${{ matrix.platform }}
          cp build/Release/modinstaller.node prebuilds/${{ matrix.platform }}/modinstaller.napi.node
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            cp ModInstaller.Native.dll prebuilds/${{ matrix.platform }}/
            cp ModInstaller.Native.lib prebuilds/${{ matrix.platform }}/
          else
            cp ModInstaller.Native.so prebuilds/${{ matrix.platform }}/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: src/ModInstaller.Native.TypeScript/prebuilds/${{ matrix.platform }}/

      - uses: actions/upload-artifact@v4
        with:
          name: native-header-${{ matrix.platform }}
          path: src/ModInstaller.Native.TypeScript/ModInstaller.Native.h

  package-native:
    needs: build-native
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js via Volta
        uses: volta-cli/action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build webpack bundle and declarations
        run: pnpm --filter @nexusmods/fomod-installer-native build-webpack

      - uses: actions/download-artifact@v4
        with:
          path: src/ModInstaller.Native.TypeScript/prebuilds/
          pattern: native-*
          merge-multiple: false

      - name: Move platform artifacts into prebuilds
        working-directory: src/ModInstaller.Native.TypeScript
        shell: bash
        run: |
          for dir in prebuilds/native-header-*/; do
            cp "$dir"ModInstaller.Native.h .
            rm -rf "$dir"
          done
          for dir in prebuilds/native-*/; do
            platform=$(basename "$dir" | sed 's/^native-//')
            mkdir -p "prebuilds/$platform"
            cp -r "$dir"* "prebuilds/$platform/"
            rm -rf "$dir"
          done
          find prebuilds/ -type f

      - name: Pack tarball
        working-directory: src/ModInstaller.Native.TypeScript
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: native-package
          path: src/ModInstaller.Native.TypeScript/*.tgz

  build-ipc:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.x"

      - name: Install Node.js via Volta
        uses: volta-cli/action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Builds the net9 Windows helper and the net48 helper Mono runs on Linux (dist/mono)
      - name: Install and build IPC
        run: |
          pnpm install
          pnpm --filter @nexusmods/fomod-installer-ipc build

      - name: Pack tarball
        working-directory: src/ModInstaller.IPC.TypeScript
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: ipc-package
          path: src/ModInstaller.IPC.TypeScript/*.tgz

  release:
    needs: [package-native, build-ipc]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-package"
          merge-multiple: true
          path: packages

      - name: Checksums
        working-directory: packages
        run: sha256sum *.tgz | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.tgz
            packages/SHA256SUMS
          prerelease: true
